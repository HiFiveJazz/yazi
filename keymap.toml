# Augment Command
[[input.prepend_keymap]]
on = ["H"]
run = "move bol"
desc = "Move to beginning of line"

[[input.prepend_keymap]]
on = ["L"]
run = "move eol"
desc = "Move to end of line"

[manager]
rename_editor = "nvim"

# Smooth Scrolling
[[mgr.append_keymap]]
on = [ "<C-j>" ]
run = "plugin augment-command -- arrow 21"
desc = "Smooth scroll Down"

[[mgr.append_keymap]]
on = [ "<C-k>" ]
run = "plugin augment-command -- arrow -21"
desc = "Smooth scroll up"

# Relative Motions
[[mgr.prepend_keymap]]
on = [ "1" ]
run = "plugin relative-motions 1"
desc = "Move in relative steps"

