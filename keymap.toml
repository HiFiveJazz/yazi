# Augment Command
[[input.prepend_keymap]]
on = ["H"]
run = "move bol"
desc = "Move to beginning of line"

[[input.prepend_keymap]]
on = ["L"]
run = "move eol"
desc = "Move to end of line"

[manager]
rename_editor = "nvim"

# [[mgr.prepend_keymap]]
# on   = "f"
# run  = "plugin jump-to-char"
# desc = "Jump to char"

[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

# Smooth Scrolling
[[mgr.append_keymap]]
on = [ "<C-j>" ]
run = "plugin neoscroll -- 21"
desc = "Smooth scroll Down"

[[mgr.append_keymap]]
on = [ "<C-k>" ]
run = "plugin neoscroll -- -21"
desc = "Smooth scroll up"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# Relative Motions
[[mgr.prepend_keymap]]
on = [ "1" ]
run = "plugin relative-motions 1"
desc = "Move in relative steps"

